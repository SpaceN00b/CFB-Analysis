<title>SEC Team Playbooks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@600&display=swap">
<style>
/* Layout: one working column; a team picker over tabs (playbook, defense, compare, method).
   Tables scroll inside their cards; bars are drawn to one 0-100% scale per table.
   Tokens follow the weekly report dashboard (cfb.report templates). */
:root {
  --page: #f9f9f7; --surface-1: #fcfcfb; --surface-2: #f3f2ee;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #6f6d68;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
  --accent: #2a78d6; --on-accent: #ffffff; --good: #006300; --bad: #b42323; --warn: #8a5a00;
  --div-pos: #2a78d6; --div-neg: #e34948; --div-mid: #f0efec;
  --turf: #e9efe6; --turf-line: #c9d6c3;
  --font-ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-head: "Space Grotesk", "Inter", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0d0d0d; --surface-1: #1a1a19; --surface-2: #242423;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #9a988f;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --accent: #3987e5; --on-accent: #ffffff; --good: #0ca30c; --bad: #e66767; --warn: #d9a13a;
    --div-pos: #3987e5; --div-neg: #e66767; --div-mid: #383835;
    --turf: #18201a; --turf-line: #2c3a2e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0d0d0d; --surface-1: #1a1a19; --surface-2: #242423;
  --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #9a988f;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
  --accent: #3987e5; --on-accent: #ffffff; --good: #0ca30c; --bad: #e66767; --warn: #d9a13a;
  --div-pos: #3987e5; --div-neg: #e66767; --div-mid: #383835;
  --turf: #18201a; --turf-line: #2c3a2e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--page); color: var(--text-primary); margin: 0;
  font: 14px/1.45 var(--font-ui); }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header h1 { font: 650 24px/1.2 var(--font-head); margin: 0 0 4px; text-wrap: balance; }
header .sub { color: var(--text-secondary); font-size: 13px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin: 16px 0 0; }
.controls label { color: var(--text-secondary); font-size: 13px; display: inline-flex; gap: 8px; align-items: center; }
select { font: inherit; color: var(--text-primary); background: var(--surface-1);
  border: 1px solid var(--axis); border-radius: 6px; padding: 5px 8px; max-width: 100%; }
nav { display: flex; gap: 4px; margin: 14px 0 14px; border-bottom: 1px solid var(--grid); overflow-x: auto; }
nav button { appearance: none; border: 0; background: none; color: var(--text-secondary); font: inherit;
  padding: 8px 12px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
nav button[aria-selected="true"] { color: var(--text-primary); border-bottom-color: var(--accent); font-weight: 600; }
button:focus-visible, select:focus-visible, tr.row-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 16px; min-width: 0; }
.card h2 { font: 600 16px/1.3 var(--font-head); margin: 0 0 4px; }
.card h3 { font-size: 13px; margin: 14px 0 6px; font-weight: 600; color: var(--text-secondary); }
.hint { color: var(--text-muted); font-size: 12px; margin: 0 0 10px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.split { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .split { grid-template-columns: 1fr; } }
.facts { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 4px 0 2px; }
.fact .k { color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
.fact .v { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.fact .d { color: var(--text-secondary); font-size: 12px; }
.table-scroll { overflow-x: auto; max-height: 640px; overflow-y: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { color: var(--text-secondary); font-weight: 600; font-size: 12px; white-space: nowrap; position: sticky; top: 0; background: var(--surface-1); z-index: 1; }
th.sortable { cursor: pointer; }
th.sortable::after { content: " \2195"; color: var(--text-muted); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.row-link { cursor: pointer; }
tr.row-link:hover td { background: var(--surface-2); }
tr.sel td { background: var(--surface-2); box-shadow: inset 0 0 0 0 transparent; }
tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.muted { color: var(--text-muted); }
.small { font-size: 12px; }
.pill { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--axis);
  color: var(--text-secondary); white-space: nowrap; }
.pill.flag { border-color: var(--bad); color: var(--bad); font-weight: 600; }
.pill.watch { border-color: var(--warn); color: var(--warn); }
.pill.ok { border-color: var(--good); color: var(--good); }
.pill.info { border-color: var(--accent); color: var(--accent); }
.verdict { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; font-size: 15px; font-weight: 600; margin: 2px 0 8px; }
.grids { display: flex; flex-wrap: wrap; gap: 16px; }
.grids > div { min-width: 0; flex: 1 1 280px; }
svg { display: block; max-width: 100%; height: auto; }
svg text { fill: var(--text-muted); font-size: 11px; font-family: var(--font-ui); }
svg text.cell { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.bars { display: grid; grid-template-columns: minmax(90px, 150px) 1fr 48px; gap: 6px 10px; align-items: center; font-size: 12px; }
.bar-track { position: relative; height: 10px; background: var(--surface-2); border-radius: 4px; }
.bar-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 4px; }
.bars .num { text-align: right; font-variant-numeric: tabular-nums; }
.dir-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.dir-tile { border: 1px solid var(--border); border-radius: 8px; padding: 10px; background: var(--surface-1); }
.dir-tile .k { color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
.dir-tile .v { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.dir-tile .d { font-size: 12px; color: var(--text-secondary); }
.chip { display: inline-block; min-width: 56px; padding: 2px 6px; border-radius: 4px; text-align: center; font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--text-secondary); margin: 6px 0; align-items: center; }
.legend .sw { display: inline-block; width: 28px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; }
.tooltip { position: fixed; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border);
  box-shadow: 0 4px 14px rgba(0,0,0,.14); border-radius: 8px; padding: 8px 10px; font-size: 12px; max-width: 260px; z-index: 20; }
.prose { max-width: 72ch; }
.prose p, .prose li { color: var(--text-secondary); }
.prose h3 { color: var(--text-primary); font-size: 14px; margin: 18px 0 4px; }
details summary { cursor: pointer; color: var(--text-secondary); font-size: 13px; }
footer { color: var(--text-muted); font-size: 12px; margin-top: 24px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (max-width: 520px) { .dir-tiles { grid-template-columns: 1fr; } .bars { grid-template-columns: 90px 1fr 42px; } }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 900px) { .pair { grid-template-columns: 1fr; } }
.mbar { position: relative; height: 10px; min-width: 80px; background: var(--surface-2); border-radius: 4px; }
.mbar .t { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 4px; }
.mbar .f { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text-primary); opacity: .55; }
.up { color: var(--good); } .down { color: var(--bad); }
ul.summary { margin: 4px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
ul.summary li { color: var(--text-primary); }
</style>

<div class="wrap">
  <header>
    <h1 id="title">SEC Team Playbooks</h1>
    <div class="sub" id="subtitle"></div>
    <div class="controls">
      <label for="team">Team <select id="team"></select></label>
      <span class="small muted" id="teamnote"></span>
    </div>
  </header>
  <nav role="tablist" id="tabs">
    <button role="tab" data-tab="offense" aria-selected="true">Offense playbook</button>
    <button role="tab" data-tab="situations" aria-selected="false">By situation</button>
    <button role="tab" data-tab="defense" aria-selected="false">Defense</button>
    <button role="tab" data-tab="compare" aria-selected="false">Compare teams</button>
    <button role="tab" data-tab="method" aria-selected="false">Method</button>
  </nav>
  <main>
    <section id="tab-offense" class="stack"></section>
    <section id="tab-situations" class="stack" hidden></section>
    <section id="tab-defense" class="stack" hidden></section>
    <section id="tab-compare" class="stack" hidden></section>
    <section id="tab-method" class="stack" hidden></section>
  </main>
  <footer id="foot"></footer>
</div>

<script>
const DATA = /*__DATA__*/null;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pct = (v, d = 0) => v == null ? "–" : (v * 100).toFixed(d) + "%";
const sgn = (v, d = 1) => v == null ? "–" : (v >= 0 ? "+" : "") + (v * 100).toFixed(d);
const num = (v, d = 2) => v == null ? "–" : Number(v).toFixed(d);
const cmp = (v, ref, tol = 0.03) => v == null || ref == null ? "" : (v - ref > tol ? "up" : (ref - v > tol ? "down" : ""));
const cmpDef = (v, ref, tol = 0.03) => cmp(ref, v, tol);

function bar(v, ref, max) {
  if (v == null) return "";
  const w = Math.max(0, Math.min(100, v / max * 100));
  const f = ref == null ? "" : `<span class="f" style="left:${Math.max(0, Math.min(100, ref / max * 100))}%" title="FBS ${pct(ref, 1)}"></span>`;
  return `<div class="mbar"><span class="t" style="width:${w}%"></span>${f}</div>`;
}
function fact(k, v, d) { return `<div class="fact"><div class="k">${k}</div><div class="v">${v}</div><div class="d">${d || ""}</div></div>`; }
function card(title, hint, body) { return `<div class="card"><h2>${title}</h2>${hint ? `<p class="hint">${hint}</p>` : ""}${body}</div>`; }
function table(head, rows, cls = "") { return `<div class="table-scroll"><table class="${cls}"><thead><tr>${head}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`; }

const teams = DATA.teams;
const byName = Object.fromEntries(teams.map((t) => [t.team, t]));
const m = DATA.meta;

function renderOffense(t) {
  const f = t.formation;
  const lg = DATA.league.find((r) => r.team === t.team) || {};
  const facts = [
    fact("Plays", t.plays, `${t.games} games, garbage time out`),
    fact("Run rate", pct(t.run_rate), `FBS ${pct(t.fbs_run_rate)}`),
    fact("Pass rate over expected", sgn(t.proe) + " pts", "vs FBS for the same situations"),
    fact("Under center", pct(f.under_center_adj ?? f.under_center), `FBS ${pct(f.fbs_under_center)}`),
    fact("No huddle", pct(f.no_huddle_adj), `crew-adjusted; raw ${pct(f.no_huddle_raw)}`),
    fact("Success rate", pct(lg.success), `EPA/play ${num(lg.epa)}`),
  ].join("");
  const summary = t.summary.length ? `<ul class="summary">${t.summary.map((s) => `<li>${esc(s)}</li>`).join("")}</ul>` : `<p class="hint">No tendency stands out from the FBS norms used here.</p>`;
  const form = table(
    `<th>Formation</th><th class="num">Share</th><th class="num">Run rate</th><th class="num">FBS run rate</th><th class="num">Success</th>`,
    [["Shotgun", f.shotgun, f.run_rate_sg, f.fbs_run_rate_sg, f.success_sg],
     ["Under center", f.under_center, f.run_rate_uc, f.fbs_run_rate_uc, f.success_uc]].map((r) =>
      `<tr><td>${r[0]}${r[0] === "Under center" ? ` <span class="small muted">(${f.n_uc} plays)</span>` : ""}</td><td class="num">${pct(r[1])}</td><td class="num">${pct(r[2])}</td><td class="num">${pct(r[3])}</td><td class="num">${pct(r[4])}</td></tr>`));
  const maxShare = Math.max(...t.mix.map((r) => Math.max(r.share || 0, r.fbs_share || 0)));
  const mix = table(
    `<th>Play type</th><th class="num">Plays</th><th>Share (line = FBS)</th><th class="num">Share</th><th class="num">FBS</th><th class="num">Success</th><th class="num">FBS</th><th class="num">EPA</th>`,
    t.mix.filter((r) => r.n > 0).map((r) => `<tr><td>${esc(r.group)}</td><td class="num">${r.n}</td><td>${bar(r.share, r.fbs_share, maxShare)}</td>
      <td class="num">${pct(r.share, 1)}</td><td class="num muted">${pct(r.fbs_share, 1)}</td>
      <td class="num ${cmp(r.success, r.fbs_success, 0.05)}">${pct(r.success)}</td><td class="num muted">${pct(r.fbs_success)}</td><td class="num">${num(r.epa)}</td></tr>`));
  const tops = table(
    `<th>Formation</th><th>Play</th><th class="num">Plays</th><th class="num">Share</th><th class="num">No huddle</th><th class="num">Success</th><th class="num">EPA</th><th class="num">Yds</th><th>Gets the ball most</th><th>Downs 1 / 2 / 3+</th>`,
    t.top_plays.map((r) => `<tr><td>${r.formation}</td><td>${esc(r.play)}</td><td class="num">${r.n}</td><td class="num">${pct(r.share, 1)}</td><td class="num">${pct(r.no_huddle)}</td>
      <td class="num">${pct(r.success)}</td><td class="num">${num(r.epa)}</td><td class="num">${num(r.yards, 1)}</td>
      <td>${esc(r.top_player || "–")} <span class="small muted">${r.top_player_share != null ? pct(r.top_player_share) : ""}</span></td>
      <td class="small">${["1", "2", "3+"].map((k) => pct(r.downs[k] || 0)).join(" / ")}</td></tr>`));
  const players = table(
    `<th>Player</th><th>Pos</th><th class="num">Touches</th><th class="num">Runs</th><th class="num">Targets</th><th class="num">Share</th><th class="num">Shotgun</th><th>Most common play</th><th class="num">Success</th><th>Style (player maps)</th>`,
    t.players.map((r) => `<tr><td>${esc(r.player)}</td><td>${esc(r.pos)}</td><td class="num">${r.touches}</td><td class="num">${r.rushes}</td><td class="num">${r.targets}</td>
      <td class="num">${pct(r.share, 1)}</td><td class="num">${pct(r.shotgun)}</td><td>${esc(r.top_play)} <span class="small muted">${pct(r.top_play_share)}</span></td>
      <td class="num">${pct(r.success)}</td><td class="small">${esc(r.style || "–")}</td></tr>`));
  $("#tab-offense").innerHTML = [
    `<div class="card"><div class="facts">${facts}</div><h3>What stands out</h3>${summary}</div>`,
    card("Most-called plays", `Formation x play type x direction x position of the ball carrier or target, out of ${t.plays} plays (sacks and throwaways left out). Directions are the offense's.`, tops),
    card("Formation", "The text only says Shotgun or nothing (under center, or a crew that did not write it). No personnel, pistol, motion or play action.", form),
    card("Play-type mix", "Share of the team's plays, with the FBS share as a line. Green or red success = 5+ points from FBS. QB runs include scrambles; the text cannot separate them.", mix),
    card("Who gets the ball", "Top 10 by touches (rushes plus targets). Style labels come from the SEC player maps.", players),
  ].join("");
}

function renderSituations(t) {
  const rows = t.situations.map((r) => `<tr><td>${esc(r.situation)}</td><td class="num">${r.n}</td>
    <td class="num">${pct(r.run_rate)}</td><td class="num muted">${pct(r.fbs_run_rate)}</td>
    <td class="num ${cmp(r.pass_rate, r.exp_pass, 0.05)}">${sgn(r.pass_rate - r.exp_pass, 0)}</td>
    <td class="num">${pct(r.shotgun)}</td><td class="num muted">${pct(r.fbs_shotgun)}</td>
    <td class="num">${pct(r.screen)}</td><td class="num">${pct(r.deep)}</td>
    <td>${esc(r.top_play)} <span class="small muted">${pct(r.top_play_share)}</span></td>
    <td class="num ${cmp(r.success, r.fbs_success, 0.05)}">${pct(r.success)}</td><td class="num muted">${pct(r.fbs_success)}</td></tr>`);
  $("#tab-situations").innerHTML = card("Calls by down, distance and field position",
    "Pass vs expected: pass share minus the FBS model's expectation for the same down, distance, field position, score and clock, in points. Rows overlap (red zone includes goal to go). Small rows (under 25 plays) are noisy.",
    table(`<th>Situation</th><th class="num">Plays</th><th class="num">Run</th><th class="num">FBS</th><th class="num">Pass vs exp.</th><th class="num">Shotgun</th><th class="num">FBS</th><th class="num">Screen</th><th class="num">Deep</th><th>Most common play</th><th class="num">Success</th><th class="num">FBS</th>`, rows));
}

function renderDefense(t) {
  const d = t.defense;
  const facts = [
    fact("Plays faced", d.plays, "garbage time out"),
    fact("Success allowed", pct(d.success_allowed), `FBS ${pct(d.fbs_success)}`),
    fact("EPA allowed/play", num(d.epa_allowed), `FBS ${num(d.fbs_epa)}`),
    fact("Sack rate", pct(d.sack_rate, 1), `FBS ${pct(d.fbs_sack_rate, 1)}, per dropback`),
    fact("Hurry rate", pct(d.hurry_rate, 1), `FBS ${pct(d.fbs_hurry_rate, 1)}; crews chart hurries mostly on incompletions`),
    fact("Opponents' pass vs exp.", sgn(d.opp_proe) + " pts", "how often teams throw on it"),
  ].join("");
  const groups = table(`<th>Play type faced</th><th class="num">Plays</th><th class="num">Share</th><th class="num">FBS</th><th class="num">Success allowed</th><th class="num">Shrunk</th><th class="num">FBS</th><th class="num">EPA</th>`,
    d.groups.map((r) => `<tr><td>${esc(r.group)}</td><td class="num">${r.n}</td><td class="num">${pct(r.share_faced, 1)}</td><td class="num muted">${pct(r.fbs_share, 1)}</td>
      <td class="num">${pct(r.success_allowed)}</td><td class="num ${cmpDef(r.shrunk, r.fbs_success, 0.04)}">${pct(r.shrunk)}</td><td class="num muted">${pct(r.fbs_success)}</td><td class="num">${num(r.epa_allowed)}</td></tr>`));
  const defs = d.defenders.length ? table(`<th>Defender</th><th>Listed</th><th class="num">Plays made</th><th>Plays like (role model)</th><th>Where he makes plays</th><th class="num">Sacks</th><th class="num">Hurries</th><th class="num">PBU</th><th class="num">INT</th>`,
    d.defenders.map((r) => `<tr><td>${esc(r.player)}</td><td>${esc(r.pos)}</td><td class="num">${r.events}</td><td>${esc(r.pred_role)} <span class="small muted">${pct(r.pred_p)}</span></td><td class="small">${esc(r.location)}</td>
      <td class="num">${r.sacks}</td><td class="num">${r.hurries}</td><td class="num">${r.pbu}</td><td class="num">${r.ints}</td></tr>`)) : `<p class="hint">Player maps not found when this page was built.</p>`;
  $("#tab-defense").innerHTML = [
    `<div class="card"><div class="facts">${facts}</div></div>`,
    card("Success allowed by play type", `Shrunk toward the FBS rate with ${20} plays. Green = allows less than FBS by 4+ points, red = more. Defensive fronts and coverages are not in the data.`, groups),
    card("Most active defenders", "From the SEC player maps: tackles, sacks, hurries, breakups and interceptions, and the role their play locations look like.", defs),
  ].join("");
}

let sortKey = "team", sortDir = 1;
function renderCompare() {
  const cols = [
    ["team", "Team", (v) => esc(v)], ["plays", "Plays", (v) => v], ["under_center_adj", "Under center", (v) => pct(v)],
    ["run_rate_uc", "Run rate UC", (v) => pct(v)], ["no_huddle_adj", "No huddle (adj.)", (v) => pct(v)],
    ["run_rate", "Run rate", (v) => pct(v)], ["proe", "Pass vs exp.", (v) => sgn(v)], ["rb_run", "RB runs", (v) => pct(v)],
    ["qb_run", "QB runs", (v) => pct(v)], ["screen", "Screens", (v) => pct(v)], ["deep", "Deep 20+", (v) => pct(v)],
    ["success", "Off. success", (v) => pct(v)], ["epa", "Off. EPA", (v) => num(v)], ["def_success", "Def. success allowed", (v) => pct(v)],
    ["def_epa", "Def. EPA allowed", (v) => num(v)], ["def_sack_rate", "Def. sack rate", (v) => pct(v, 1)],
  ];
  const rows = [...DATA.league].sort((a, b) => (a[sortKey] > b[sortKey] ? 1 : a[sortKey] < b[sortKey] ? -1 : 0) * sortDir);
  const head = cols.map(([k, l]) => `<th class="sortable${k === "team" ? "" : " num"}" data-k="${k}" tabindex="0">${l}</th>`).join("");
  const body = rows.map((r) => `<tr>${cols.map(([k, , fmt]) => `<td class="${k === "team" ? "" : "num"}">${fmt(r[k])}</td>`).join("")}</tr>`);
  $("#tab-compare").innerHTML = card("All SEC offenses and defenses", `FBS: run rate ${pct(m.fbs_run_rate)}, under center ${pct(m.fbs_under_center)}, no huddle ${pct(m.fbs_no_huddle)} (raw). Click a column to sort.`, table(head, body));
  document.querySelectorAll("#tab-compare th.sortable").forEach((th) => {
    const go = () => { const k = th.dataset.k; sortDir = sortKey === k ? -sortDir : (k === "team" ? 1 : -1); sortKey = k; renderCompare(); };
    th.addEventListener("click", go);
    th.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
  });
}

function renderMethod() {
  $("#tab-method").innerHTML = `<div class="card prose">
    <h2>What this is built from</h2>
    <p>CFBD play-by-play text for ${m.season}, weeks ${m.weeks ? m.weeks.join(" to ") : "?"}, parsed by the project's play-text parser, with player names and positions matched to rosters (the same data as the SEC player maps). ${m.plays_fbs.toLocaleString()} FBS offensive plays set the FBS comparisons. Garbage time, kneels, spikes and plays wiped out by penalties are left out.</p>
    <h3>What the text has</h3>
    <ul><li>"Shotgun" and "No Huddle" before the play. No word means under center, or a stat crew that did not write it.</li>
    <li>Run direction (left, middle, right), pass depth and direction, air yards, the ball carrier or intended receiver, tacklers, sacks and hurries.</li></ul>
    <h3>What it does not have</h3>
    <ul><li>Personnel groupings (11, 12, 21), formation names (trips, empty, pistol, I), motion, play action, RPOs, run schemes, or designed QB runs versus scrambles. Sportradar's screen, play-action and RPO flags are false on every 2026 play.</li>
    <li>So a "play" here is formation x play type x direction x position, not a named concept. "Screen / behind LOS" is any pass caught at or behind the line.</li>
    <li>Detailed text exists only from 2025 week 9 on. Earlier seasons cannot be charted this way.</li></ul>
    <h3>Adjustments</h3>
    <ul><li>No-huddle charting depends on the home stat crew: the venue alone explains 44% of the game-to-game variation. The adjusted share is the team's effect from a fit with a team term and a venue term over every FBS game. Under center is mostly the team (the venue adds 3 points of R²); it gets the same adjustment.</li>
    <li>Pass rate over expected uses an FBS logistic model on down, distance, field position, score, quarter and clock.</li></ul>
    <h3>Does it help the model?</h3>
    <p>Tested 2026-11-18 as a second stage on model_v2 (scripts/playbook_check.py): nine tendency columns (under center, no huddle, pass rate over expected, screens, deep shots, QB runs, play-mix spread, sack and hurry rates), each from the team's earlier games only, refit before every 2026 week. Every version made 2026 log loss worse (all FBS games: +0.0025 to +0.0120 depending on the penalty; SEC games: +0.0016 to +0.0150). No huddle alone had the largest in-sample slope (-1.4 points per SD, t -2.7, 9 columns tried) and still did not help out of sample. Tendencies describe how a team plays; the model's efficiency ratings already carry how well.</p>
  </div>`;
}

function render() {
  const t = byName[$("#team").value];
  $("#teamnote").textContent = `${t.plays} offensive plays in ${t.games} games`;
  renderOffense(t); renderSituations(t); renderDefense(t);
}

function init() {
  $("#subtitle").textContent = `${m.season} season, weeks ${m.weeks ? m.weeks.join("-") : "?"} · built ${m.built_utc} UTC from play-by-play text · experimental, not used by the model`;
  $("#team").innerHTML = teams.map((t) => `<option>${esc(t.team)}</option>`).join("");
  let saved = null;
  try { saved = localStorage.getItem("pb-team"); } catch (e) {}
  if (saved && byName[saved]) $("#team").value = saved;
  $("#team").addEventListener("change", () => { try { localStorage.setItem("pb-team", $("#team").value); } catch (e) {} render(); });
  document.querySelectorAll("#tabs button").forEach((b) => b.addEventListener("click", () => {
    document.querySelectorAll("#tabs button").forEach((x) => x.setAttribute("aria-selected", x === b ? "true" : "false"));
    document.querySelectorAll("main > section").forEach((s) => { s.hidden = s.id !== "tab-" + b.dataset.tab; });
  }));
  render(); renderCompare(); renderMethod();
  $("#foot").textContent = "Source: CFBD play-by-play (stat-crew text), CFBD rosters, Sportradar positions. Directions are the offense's left and right.";
}
init();
</script>
