[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfb"
version = "0.1.0"
description = "NCAA FBS game prediction: data pipeline, features, models"
requires-python = ">=3.11"
# pandas 3 is required: AsOfView hands out slices of cached tables and relies on
# copy-on-write so callers cannot change the cache.
dependencies = ["requests>=2.31", "numpy>=1.26", "pandas>=3.0", "pyarrow>=15"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# OS keyring for keys on a PC (Windows Credential Manager); cfb.settings.secret reads it.
keyring = ["keyring>=25"]
# S3 access to the R2 warehouse bucket (the PC sync with read-only keys); the cloud uses the REST API.
r2 = ["boto3>=1.34"]
# Local app (cfb-ui): Streamlit UI over the report bundles and the warehouse.
ui = ["streamlit>=1.67", "keyring>=25", "boto3>=1.34"]

[project.scripts]
cfb-ingest = "cfb.ingest:main"
cfb-core = "cfb.core.build:main"
cfb-features = "cfb.features.build:main"
cfb-warehouse = "cfb.warehouse_sync:main"
cfb-ui = "cfb.ui.launch:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
