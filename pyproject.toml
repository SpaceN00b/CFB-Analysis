[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfb"
version = "0.1.0"
description = "NCAA FBS game prediction: data pipeline, features, models"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "pandas>=2.2", "pyarrow>=15"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cfb-ingest = "cfb.ingest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
