# Configuration of the weekly run (python -m cfb.run_week) and the report it writes.
#
# Switching the report from a baseline to the model is a change of `primary` (and, if the
# model's predictions are not already on disk, a `producers` entry).

[models]
# The model the report is about: its picks, reasons and edges. Any model_id with a producer
# below, a built-in baseline, or predictions already in data/predictions/<model_id>/.
primary = "model_v1"
# Shown next to the primary model and scored against it. Built in: baseline_close,
# baseline_moneyline, baseline_elo, baseline_home.
baselines = ["baseline_close", "baseline_moneyline", "baseline_elo", "baseline_home"]

[producers]
# model_id = "module:function". Called as function(warehouse, games) and must return the
# frame cfb.eval.splits.walk_forward returns: prediction columns plus season, season_type,
# week. `games` holds schedule rows (no results) of the season through the target week.
# A model without a producer is read from data/predictions/<model_id>/ as it stands.
# model_v1: win probability (frozen W8 model) plus the phase 2 spread and total
# (pred_margin, pred_total; cfb.model.points_config). Primary since gate 3 (2026-11-17).
model_v1 = "cfb.predict:produce"

[run]
# Rebuild unit ratings and feature groups for the season before predicting. The baselines
# do not need them; the model and the team profiles in the dashboard do.
build_features = true
# Market used for "edge": the de-vigged moneyline where it exists, else the closing-spread
# baseline. Either may be missing for a game.
market_models = ["baseline_moneyline", "baseline_close"]
# Time zone for kickoff times in the report and dashboard.
timezone = "America/New_York"

[rankings]
# Model top N next to the AP, Coaches and playoff committee top 25 (report section and
# dashboard tab). For reading only: rankings are built after the predictions and are never a
# model input. source: "power" (W3 power rating), "elo" (in-house Elo), or "module:function"
# returning team_id + rating from an AsOfView (see cfb/report/rankings.py). "" turns it off.
source = "power"
top = 50
